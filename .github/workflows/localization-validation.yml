name: Localization Validation

on:
  push:
    branches:
      - feature/firebase-remote-localization
  workflow_dispatch:

concurrency:
  group: localization-validation
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Compile and test localization
        run: >-
          ./gradlew
          :core:core-resource:desktopTest
          :app:desktop:compileKotlinDesktop
          :app:android:compileDevelopDebugKotlin
          --stacktrace
